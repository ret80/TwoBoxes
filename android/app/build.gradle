apply plugin: 'com.android.application'

// Подпись release-сборки для Google Play. Кеуstore и пароли лежат вне git, в
// папке `keys/` в корне проекта: потеря ключа — невозможность выпускать
// обновления.
def keystoreDir = new File(rootProject.projectDir, "../keys")
def keystorePropertiesFile = new File(keystoreDir, "keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// Версии для Google Play считаются сами, чтобы загрузку не отклонили из-за
// забытого versionCode: versionName повторяет версию игры (0.5.<хеш> — как в
// подписи меню), а versionCode — число коммитов. Новый коммит всегда повышает
// код; после переписывания истории (rebase/squash) код может уменьшиться, тогда
// его нужно поднять вручную: Play принимает только растущие номера.
def git = { List<String> args ->
    try {
        providers.exec {
            commandLine(['git'] + args)
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
    } catch (Exception ignored) {
        ''
    }
}

def gameVersion = new groovy.json.JsonSlurper()
    .parseText(new File(rootProject.projectDir, '../package.json').text).version
def versionNameBase = gameVersion.split('\\.').take(2).join('.')

def commitHash = git(['rev-parse', '--short', 'HEAD'])
def commitCount = git(['rev-list', '--count', 'HEAD'])

def appVersionName = commitHash ? "${versionNameBase}.${commitHash}" : versionNameBase
def appVersionCode = commitCount ? commitCount.toInteger() : 1

logger.lifecycle("Android-версия: versionName=${appVersionName}, versionCode=${appVersionCode}")

android {
    namespace = "com.twoboxpuzzle.game"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.twoboxpuzzle.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile new File(keystoreDir, keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
